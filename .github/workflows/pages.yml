name: Deploy to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Pages via REST API
        run: |
          set -x
          curl -s -o /tmp/resp.json -w "HTTP_CODE:%{http_code}"             -X PUT             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Content-Type: application/json"             -d "{\"source\":{\"branch\":\"main\",\"path\":\"/\"}}"             "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
          echo "Response:"
          cat /tmp/resp.json

      - name: Upload artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print URL
        if: success()
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
